<title>ПЕРЕКЛАД · svenska -> українська</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060606; --panel:#0e0e0e; --panel-2:#151515; --line:#232323; --line-2:#2e2e2e;
  --text:#d8d2d2; --dim:#6f6868; --dim-2:#4a4545;
  --red:#c3252c; --red-d:#7a1418; --red-dd:#3a0a0c; --red-l:#ff5a5f;
  --px:'Minecraft', 'Minecraftia', 'Press Start 2P', monospace;
  --logo:'Minecraft', 'Minecraftia', 'Press Start 2P', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--px);overflow:hidden;}
body{-webkit-font-smoothing:none;font-smooth:never;}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
.hidden{display:none !important;}
::selection{background:var(--red-d);color:#fff;}

/* ---------- сцена: зірки і піксельний горизонт ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;}
#scene svg{position:absolute;left:0;bottom:0;width:100%;height:46vh;}
#stars{position:absolute;inset:0;}
#stars i{position:absolute;width:3px;height:3px;background:#3a3434;}
#stars i.r{background:var(--red-d);}
#stars i.b{width:4px;height:4px;background:#5a5252;}
@keyframes tw{50%{opacity:.25;}}
#stars i.t{animation:tw 3.5s steps(2) infinite;}

/* ---------- піксельні рамки (сходинки) ---------- */
.px{clip-path:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;background:var(--panel-2);color:var(--text);
  box-shadow:inset 0 0 0 3px var(--line-2), inset -3px -6px 0 3px #090909, inset 3px 3px 0 3px #222;
  font-size:12px;letter-spacing:0;text-transform:uppercase;transition:transform .06s;}
.btn:hover{background:#1b1b1b;}
.btn:active{transform:translateY(3px);}
.btn.red{background:var(--red-d);color:#ffe9e9;box-shadow:inset 0 0 0 3px #a01c22, inset -3px -6px 0 3px #4d0c0f, inset 3px 3px 0 3px #b8333a;}
.btn.red:hover{background:#8c181d;}
.btn.small{padding:8px 12px;font-size:10px;gap:6px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.ico{width:1.2em;height:1.2em;display:inline-block;image-rendering:pixelated;}

/* ---------- екрани ---------- */
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px 18vh;}
#lang{position:fixed;top:16px;right:16px;z-index:5;display:flex;gap:0;}
#lang button{padding:6px 10px;font-size:10px;color:var(--dim);background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);}
#lang button.on{color:#fff;background:var(--red-dd);box-shadow:inset 0 0 0 2px var(--red-d);}

.logo{font-family:var(--logo);font-size:clamp(26px,5.5vw,56px);font-weight:400;color:#ffffff;line-height:1;
  text-shadow:4px 4px 0 #000000;}
.tag{margin-top:22px;font-size:clamp(10px,1.5vw,14px);color:var(--dim);letter-spacing:0;text-transform:uppercase;}
.tag .arr{color:var(--red);}

.drop{margin-top:44px;width:min(560px,92vw);padding:30px 24px 26px;background:var(--panel);text-align:center;position:relative;
  box-shadow:inset 0 0 0 3px var(--line-2), inset 0 -6px 0 3px #0a0a0a;}
.drop.over{background:#1a0a0b;box-shadow:inset 0 0 0 3px var(--red);}
.drop .btn{width:100%;font-size:14px;padding:16px;}
.drop .hint{margin-top:10px;font-size:10px;color:var(--dim-2);line-height:1.4;}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

.codebox{margin-top:22px;width:min(560px,92vw);display:flex;flex-direction:column;align-items:center;gap:10px;}
.codebox .lbl{font-size:12px;color:var(--dim);}
.coderow{display:flex;gap:10px;width:100%;}
#code{flex:1;min-width:0;padding:12px 14px;font-size:18px;text-transform:uppercase;text-align:center;
  background:#0b0b0b;border:none;outline:none;color:#fff;box-shadow:inset 0 0 0 3px var(--line-2);}
#code:focus{box-shadow:inset 0 0 0 3px var(--red);}
#code::placeholder{color:#2e2a2a;}
.err{min-height:20px;font-size:10px;color:var(--red-l);text-align:center;margin-top:8px;}

.recent{margin-top:22px;width:min(560px,92vw);}
.recent .lbl{font-size:10px;color:var(--dim-2);text-transform:uppercase;margin-bottom:8px;}
.recent a{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;margin-bottom:6px;background:var(--panel);color:var(--text);text-decoration:none;font-size:10px;box-shadow:inset 0 0 0 2px var(--line);}
.recent a:hover{box-shadow:inset 0 0 0 2px var(--red-d);}
.recent a span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.recent a span:last-child{color:var(--red);flex:0 0 auto;}

/* ---------- робота ---------- */
#work .title{font-size:clamp(14px,2.5vw,20px);max-width:90vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.bar{margin-top:34px;width:min(620px,90vw);height:34px;padding:5px;background:#0b0b0b;box-shadow:inset 0 0 0 3px var(--line-2);display:flex;gap:4px;}
.bar i{flex:1;background:#141414;}
.bar i.on{background:var(--red);box-shadow:inset 0 -4px 0 var(--red-d);}
.stage{margin-top:22px;font-size:12px;color:var(--text);min-height:16px;text-align:center;line-height:1.5;}
.substage{margin-top:8px;font-size:10px;color:var(--dim);min-height:14px;text-align:center;line-height:1.5;}
.blink{animation:tw 1s steps(2) infinite;}
#work .btn{margin-top:36px;}

/* ---------- перегляд ---------- */
#view{padding:0;justify-content:flex-start;background:#000;}
.vtop{flex:0 0 auto;width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:#080808;box-shadow:0 3px 0 #111;z-index:3;}
.vtop .vtitle{flex:1;min-width:0;font-size:10px;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.5;}
.seg{display:flex;}
.seg button{padding:8px 12px;font-size:10px;color:var(--dim);background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);}
.seg button.on{color:#fff;background:var(--red-d);box-shadow:inset 0 0 0 2px #a01c22;}
.stage-wrap{flex:1 1 auto;width:100%;min-height:0;position:relative;overflow:hidden;touch-action:pan-y pinch-zoom;}
.pages{position:absolute;inset:0;display:flex;transition:transform .28s steps(8);}
.pg{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;padding:14px;position:relative;}
.pg .holder{position:relative;max-width:100%;max-height:100%;}
.pg img{display:block;max-width:100%;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);width:auto;height:auto;image-rendering:auto;box-shadow:0 0 0 2px #1a1a1a;background:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.pg .hot{position:absolute;inset:0;}
.pg .hot i{position:absolute;cursor:pointer;}
.pg .hot i:hover{outline:2px dashed rgba(195,37,44,.55);}
.vbot{flex:0 0 auto;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#080808;box-shadow:0 -3px 0 #111;z-index:3;}
.vbot .count{min-width:90px;text-align:center;font-size:12px;}
.vbot .sp{flex:1;}
.tip{position:fixed;z-index:20;max-width:min(520px,92vw);background:#0d0d0d;color:var(--text);padding:16px 18px;font-size:14px;line-height:1.45;
  box-shadow:inset 0 0 0 3px var(--red-d);}
.tip .k{font-size:10px;color:var(--red);margin-bottom:6px;}
.tip .sv{font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#fff;-webkit-font-smoothing:antialiased;}
.tip .uk{font-family:Helvetica,Arial,sans-serif;font-size:12px;color:var(--dim);margin-top:10px;-webkit-font-smoothing:antialiased;}
.office{flex:1;width:100%;border:none;background:#fff;}
.office-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;color:var(--dim);font-size:12px;line-height:1.6;}

/* ---------- модальне вікно ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px;}
.modal .box{width:min(520px,94vw);background:var(--panel);padding:28px 24px;text-align:center;box-shadow:inset 0 0 0 3px var(--line-2);}
.modal .k{font-size:12px;color:var(--dim);}
.modal .bigcode{font-size:clamp(40px,10vw,70px);color:#fff;margin:12px 0 6px;text-shadow:4px 4px 0 var(--red-dd);}
.modal .link{font-size:10px;color:var(--red-l);word-break:break-all;margin-top:6px;}
.modal img{width:170px;height:170px;margin:18px auto 6px;display:block;image-rendering:pixelated;background:#fff;padding:8px;}
.modal .row{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap;}
.modal .note{font-size:9px;color:var(--dim);margin-top:16px;line-height:1.6;}

@media (max-width:640px){
  .vtop .vtitle{display:none;}
  .vbot .count{min-width:70px;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
</style>
</head>
<body>

</section>

<div class="modal hidden" id="share">
  <div class="box px">
    <div class="k" data-t="codeLabel"></div>

    <div class="link" id="s-link"></div>

    <div class="row"><button class="btn small px" id="s-copy" data-t="copy"></button><button class="btn small red px" id="s-close">OK</button></div>

</div>

<script>
/* =====================================================================
   ДВИЖОК ПЕРЕВОДА (работает в браузере)
   ===================================================================== */
const CDN = {
  pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs',
  pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs',
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  jszip: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  jspdf: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
  blob: 'https://esm.sh/@vercel/blob@2.8.2/client'
};
const FONT = 'Helvetica, Arial, "Segoe UI", Roboto, sans-serif';
const TARGET_LONG = 1800;
const LETTER = /\p{L}/u;

const _loaded = {};
function loadScript(src) {
  if (_loaded[src]) return _loaded[src];
  return _loaded[src] = new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => ok(); s.onerror = () => { delete _loaded[src]; bad(new Error('load ' + src)); };
    document.head.appendChild(s);
  });
}
let _pdfjs = null;
async function getPdfjs() {
  if (_pdfjs) return _pdfjs;
  _pdfjs = await import(CDN.pdfjs);
  _pdfjs.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
  return _pdfjs;
}

let _ocr = null, _ocrPsm = null;
async function getOcr(onProgress) {
  if (!_ocr) {
    await loadScript(CDN.tesseract);
    _ocr = Tesseract.createWorker('swe', 1, {
      logger: m => { if (onProgress && m.status && /loading|initializ/.test(m.status)) onProgress(m.progress || 0); }
    });
  }
  return _ocr;
}
async function ocrCanvas(canvas, psm, onProgress) {
  const w = await getOcr(onProgress);
  if (_ocrPsm !== psm) { await w.setParameters({ tessedit_pageseg_mode: String(psm), preserve_interword_spaces: '1' }); _ocrPsm = psm; }
  const { data } = await w.recognize(canvas, {}, { blocks: true, text: false });
  const lines = [];
  (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => lines.push(l))));
  return lines;
}

/* ---------- утилиты ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
// Швидка перевірка: фото/фон (багато кольорів, мало білого) не містить тексту для перекладу — OCR на них пропускаємо
function imageStats(img) {
  const c = makeCanvas(48, 48), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, 48, 48);
  const d = x.getImageData(0, 0, 48, 48).data; const bins = new Set(); let white = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] > 235 && d[i + 1] > 235 && d[i + 2] > 235) white++;
    bins.add((d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4));
  }
  freeCanvas(c);
  return { white: white / 2304, bins: bins.size };
}
function rotateCanvas(c, deg) {
  const out = makeCanvas(c.height, c.width), x = out.getContext('2d', { willReadFrequently: true });
  if (deg > 0) { x.translate(out.width, 0); x.rotate(Math.PI / 2); } else { x.translate(0, out.height); x.rotate(-Math.PI / 2); }
  x.drawImage(c, 0, 0); return out;
}
function canvasToBlob(c, type, q) { return new Promise(ok => c.toBlob(b => ok(b), type || 'image/jpeg', q || 0.86)); }
function freeCanvas(c) { if (c) { c.width = 1; c.height = 1; } }
const dist = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
function median(arr) { const s = arr.slice().sort((a, b) => a - b); return s.length ? s[s.length >> 1] : 0; }
function interArea(a, b) {
  const w = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0), h = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
  return w > 0 && h > 0 ? w * h : 0;
}
async function pool(items, n, fn) {
  let i = 0; const out = new Array(items.length);
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

class QuotaError extends Error {}
async function translateTexts(texts, context, tags) {
  if (!texts.length) return [];
  for (let attempt = 0; ; attempt++) {
    let r;
    try {
      r = await fetch('/api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texts, context, tags: !!tags }) });
    } catch (e) { if (attempt < 3) { await new Promise(s => setTimeout(s, 1200 * (attempt + 1))); continue; } throw new Error('net'); }
    if (r.status === 456) throw new QuotaError('quota');

      const bold = runs.some(r => { const rp = Array.from(r.childNodes).find(n => n.localName === 'rPr'); return rp && rp.getAttribute('b') === '1'; });

    const need = f => {
      let h = 0, wordOk = true;
      for (const p of paras) {
        const s = p.sz * f;
        if (!p.text.trim()) { h += s * 1.2; continue; }
        const longest = Math.max(...p.text.split(/\s+/).map(w => textWidthPt(w, s, p.bold)));
        if (longest > W * 1.02) wordOk = false;
        let lines = 1, cur = 0; const sp = textWidthPt(' ', s, p.bold);
        for (const w of p.text.split(/\s+/).filter(Boolean)) { const ww = textWidthPt(w, s, p.bold); if (cur && cur + sp + ww > W) { lines++; cur = ww; } else cur += (cur ? sp : 0) + ww; }

    }

    for (let k = 0; k < 30; k++) { const r = need(f); if (r.wordOk && r.h <= allow) break; f *= 0.95; if (f < 0.5) { f = 0.5; break; } }

}
async function processOffice(file, kind, ui) {
  await loadScript(CDN.jszip);
  const cfg = OFFICE[kind];
  const zip = await JSZip.loadAsync(file);
  const names = Object.keys(zip.files);
  const xmlNames = names.filter(n => cfg.parts.test(n)).sort((a, b) => (parseInt(a.match(/\d+/)) || 0) - (parseInt(b.match(/\d+/)) || 0));
  const media = names.filter(n => cfg.media.test(n));
  ui.total(xmlNames.length + media.length);
  let step = 0, allText = '';
  for (const name of xmlNames) {
    if (ui.cancelled()) throw new Error('cancelled');
    step++; ui.stage(step, 'translate');
    const xml = await zip.file(name).async('string');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const pars = mergeLabelParagraphs(officeParagraphs(doc, cfg));
    allText += pars.map(p => p.full).join('\n') + '\n';
    if (pars.length) {
      const tagged = pars.map(paragraphToTagged);
      const context = pars.map(p => p.full).join('\n').slice(0, 3800);
      const tr = await translateTexts(tagged.map(t => t.tagged), context, true);
      const plainIdx = [];
      tr.forEach((t, i) => {
        if (tagged[i].simple || !t) return;
        const words = t.replace(/<[^>]+>/g, ' ').toLowerCase().match(/\p{L}{4,}/gu) || [];
        const src = pars[i].full.toLowerCase().match(/\p{L}{4,}/gu) || [];
        const dupT = words.length - new Set(words).size, dupS = src.length - new Set(src).size;
        if (dupT > dupS) plainIdx.push(i);
      });
      if (plainIdx.length) {
        const again = await translateTexts(plainIdx.map(i => escXml(pars[i].full)), context, true);
        plainIdx.forEach((i, k) => {
          const p = pars[i]; p.parts.slice(1).forEach(x => x.ts.forEach(t => t.textContent = ''));
          tr[i] = again[k]; tagged[i].simple = true; p.parts = [p.parts[0]];
        });
      }
      const bodies = new Set();
      pars.forEach((par, i) => {
        if (!tr[i]) return;
        const body = (function f(n) { while (n && n.localName !== 'txBody') n = n.parentNode; return n; })(par.p);
        applyTranslation(par, tr[i], tagged[i].simple);
        if (body) bodies.add(body);

    }
    ui.done(step);
  }
  for (const name of media) {
    if (ui.cancelled()) throw new Error('cancelled');
    step++; ui.stage(step, 'ocr');
    try {
      const data = await zip.file(name).async('blob');
      const typed = new Blob([data], { type: /\.png$/i.test(name) ? 'image/png' : 'image/jpeg' });
      const probe = await loadImage(typed);
      const st = imageStats(probe);
      const photo = st.white < 0.2 && st.bins > 200;
      if (!photo && probe.naturalWidth >= 100 && probe.naturalHeight >= 60 && probe.naturalWidth * probe.naturalHeight <= 16e6) {
        const { canvas, res } = await processImageBlob(typed, null, step, true, allText.slice(0, 2500));
        if (res.blocks.length) zip.file(name, await canvasToBlob(canvas, typed.type, 0.9));
        freeCanvas(canvas);
      }
    } catch (e) { console.warn('image', name, e); }
    ui.done(step);
  }
  const mime = kind === 'pptx' ? 'application/vnd.openxmlformats-officedocument.presentationml.presentation' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  return await zip.generateAsync({ type: 'blob', mimeType: mime, compression: 'DEFLATE' });
}

async function pagesToPdf(pages, getBlob) {
  await loadScript(CDN.jspdf);
  const { jsPDF } = window.jspdf;
  let pdf = null;
  for (const p of pages) {
    const blob = await getBlob(p);
    const data = new Uint8Array(await blob.arrayBuffer());
    const w = p.w * 0.75, h = p.h * 0.75;
    if (!pdf) pdf = new jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'pt', format: [w, h], compress: true });
    else pdf.addPage([w, h], w > h ? 'l' : 'p');
    pdf.addImage(data, 'JPEG', 0, 0, w, h, undefined, 'FAST');
  }
  return pdf.output('blob');
}

window.Engine = { processPdf, processImage, processOffice, pagesToPdf, QuotaError, CDN, loadScript };

}

  try { localStorage.setItem('recent', JSON.stringify(list.slice(0, 6))); } catch (e) {}

}

let job = null;
function kindOf(f) {
  const n = (f.name || '').toLowerCase();
  if (n.endsWith('.pdf') || f.type === 'application/pdf') return 'pdf';
  if (n.endsWith('.pptx')) return 'pptx';
  if (n.endsWith('.docx')) return 'docx';
  if (/\.(jpe?g|png|webp)$/.test(n) || /^image\/(jpeg|png|webp)$/.test(f.type)) return 'image';
  if (n.endsWith('.key')) return 'keynote';

  if (kind === 'unknown') return homeError(t('unsupported'));
  if (file.size > 80 * 1024 * 1024) return homeError(t('tooBig'));

    const buf = await file.arrayBuffer();
    let hash = null;

      try { const meta = await getDoc('hash=' + hash); if (meta) { setStage(t('cached'), ''); drawBar(1); openViewer(fromMeta(meta)); addRecent(meta); history.replaceState(null, '', '?d=' + meta.code); return; } } catch (e) {}
    }

    if (kind === 'pdf') doc = { title, kind, pages: await Engine.processPdf(buf, ui) };
    else if (kind === 'image') doc = { title, kind, pages: await Engine.processImage(file, ui) };

async function saveDoc(doc, hash) {
  if (!(await cloudOn())) { 
    doc.saving = false; 
    updateShareBtn(); 
    if (CUR === doc && (doc.kind === 'pptx' || doc.kind === 'docx')) showOffice(doc);
    return; 
  }
  try {
    const { code } = await (await fetch('/api/doc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'new' }) })).json();

    let done = 0; const n = doc.pages.length * 2 + (doc.fileBlob ? 1 : 0);

    let k = 0;
    await Promise.all(Array.from({ length: 3 }, async () => {
      while (k < doc.pages.length) {
        const i = k++; const p = doc.pages[i];

    if (!r.ok) throw new Error('finish');
    doc.code = code; doc.saving = false; doc.fileUrl = meta.file || doc.fileUrl;
    addRecent({ code, title: doc.title, pages: urls });
    if (CUR === doc) { 
      history.replaceState(null, '', '?d=' + code); 
      if (doc.kind === 'pptx' || doc.kind === 'docx') showOffice(doc); 
    }
  } catch (e) { 
    console.warn('save failed', e); 
    doc.saving = false; 
    doc.saveFailed = true; 
    if (CUR === doc && (doc.kind === 'pptx' || doc.kind === 'docx')) showOffice(doc);
  }

}

  updateShareBtn();
}
const FONT_ALT = { 'calibri': 'Carlito', 'cambria': 'Caladea', 'arial': 'Arimo', 'helvetica': 'Arimo', 'times new roman': 'Tinos', 'courier new': 'Cousine',
  'segoe ui': 'Open Sans', 'verdana': 'Open Sans', 'tahoma': 'Open Sans', 'trebuchet ms': 'Fira Sans', 'century gothic': 'Didact Gothic', 'georgia': 'Gelasio',
  'comic sans ms': 'Comic Neue', 'impact': 'Anton', 'garamond': 'EB Garamond', 'calibri light': 'Carlito', 'arial narrow': 'Arimo', 'franklin gothic book': 'Libre Franklin' };
async function loadDocFonts(buf, kind) {
  const names = new Set(); let main = '';
  try {
    if (!window.JSZip) await Engine.loadScript(Engine.CDN.jszip);
    const z = await JSZip.loadAsync(buf);
    const files = Object.keys(z.files).filter(n => /^(ppt\/(slides|slideLayouts|slideMasters|theme)\/[^/]+\.xml|word\/(document|styles|fontTable|theme\/theme1)\.xml)$/.test(n));
    for (const n of files) {
      const x = await z.file(n).async('string');
      for (const m of x.matchAll(/<a:(?:latin|ea|cs)\s+typeface="([^"]+)"/g)) if (!m[1].startsWith('+') && !m[1].startsWith('#')) names.add(m[1]);
      for (const m of x.matchAll(/w:ascii="([^"]+)"/g)) names.add(m[1]);
      for (const m of x.matchAll(/<w:font w:name="([^"]+)"/g)) names.add(m[1]);
      if (!main && /theme/.test(n)) { const mm = x.match(/<a:minorFont>\s*<a:latin\s+typeface="([^"]+)"/); if (mm) main = mm[1]; }
    }
  } catch (e) { console.warn('fonts scan', e); }
  const list = [...names].filter(n => !/^(Symbol|Wingdings.*|Webdings|Segoe UI Emoji)$/i.test(n));
  list.forEach(n => {
    const fam = FONT_ALT[n.toLowerCase()] || n;
    const id = 'gf-' + fam.replace(/\W/g, '');
    if (document.getElementById(id)) return;
    const l = document.createElement('link'); l.id = id; l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(fam).replace(/%20/g, '+') + ':ital,wght@0,400;0,700;1,400;1,700&display=swap';
    l.onerror = () => l.remove();
    document.head.appendChild(l);
  });
  const stack = n => '"' + n + '"' + (FONT_ALT[n.toLowerCase()] ? ',"' + FONT_ALT[n.toLowerCase()] + '"' : '');
  main = main || list[0] || 'Calibri';
  return { main: stack(main) + ',Arial,Arimo,sans-serif', stack, names: list };
}
function applyDocFonts(box, fonts) {
  box.querySelectorAll('[style*="font-family"]').forEach(el => {
    const ff = el.style.fontFamily; if (!ff) return;
    const first = ff.split(',')[0].replace(/["']/g, '').trim();
    el.style.fontFamily = fonts.stack(first) + ',Arial,Arimo,sans-serif';
  });
}
function showOffice(doc) {
  const frame = $('#v-office'), msg = $('#v-office-msg');
  let box = $('#v-render');
  if (!box) { box = document.createElement('div'); box.id = 'v-render'; box.style.cssText = 'flex:1;width:100%;overflow:auto;background:#555;-webkit-overflow-scrolling:touch;font-family:Calibri,Carlito,Arial,Arimo,sans-serif;'; frame.parentNode.insertBefore(box, frame); }
  const src = doc.fileBlob || doc.fileUrl;
  if (!src) {
    box.classList.add('hidden'); frame.classList.add('hidden'); msg.classList.remove('hidden');
    msg.innerHTML = `<div>${esc(doc.saving ? t('savingShort') : t('officeNoCloud'))}</div>`;
    return;
  }
  if (box.dataset.key === doc.kind + ':' + (doc.code || doc.title)) { box.classList.remove('hidden'); return; }
  msg.classList.add('hidden'); frame.classList.add('hidden'); box.classList.remove('hidden');
  box.innerHTML = '<div style="color:#fff;padding:30px;text-align:center;font-size:13px">…</div>';
  (async () => {
    try {
      const blob = doc.fileBlob || await (await fetch(doc.fileUrl)).blob();
      const buf = await blob.arrayBuffer();
      box.innerHTML = '';
      const fonts = await loadDocFonts(buf, doc.kind);
      box.style.fontFamily = fonts.main;
      if (doc.kind === 'pptx') {
        if (!window.pptxPreview) await Engine.loadScript('https://cdn.jsdelivr.net/npm/pptx-preview@1.0.5/dist/pptx-preview.umd.js');
        const w = Math.min(box.clientWidth - 20, 1100) || 900;
        const pv = window.pptxPreview.init(box, { width: w, height: Math.round(w * 9 / 16) });
        await pv.preview(buf);
        box.querySelectorAll('canvas,div').forEach(() => {});
      } else {
        if (!window.JSZip) await Engine.loadScript(Engine.CDN.jszip);
        if (!window.docx) await Engine.loadScript('https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js');
        await window.docx.renderAsync(buf, box, null, { inWrapper: true, ignoreWidth: false });
      }
      try { await document.fonts.ready; } catch (e) {}
      applyDocFonts(box, fonts);
      box.dataset.key = doc.kind + ':' + (doc.code || doc.title);
    } catch (e) {
      console.error('render failed', e);
      box.classList.add('hidden');
      if (doc.fileUrl) {
        frame.src = 'https://docs.google.com/gview?embedded=1&url=' + encodeURIComponent(doc.fileUrl);
        frame.classList.remove('hidden');
      } else { msg.classList.remove('hidden'); msg.innerHTML = '<div>Не вдалося показати. Натисни PDF/завантажити.</div>'; }
    }
  })();
}
function buildPages(doc) {
  const wrap = $('#v-pages');
  wrap.innerHTML = doc.pages.map((p, i) => `<div class="pg" data-i="${i}"><div class="holder"><img alt="" draggable="false" data-i="${i}"><div class="hot"></div></div></div>`).join('');
  loadAround(); goto(0, true);
}
function pageSrc(p) { return MODE === 'uk' ? p.uk : p.sv; }
function loadAround() {
  document.querySelectorAll('#v-pages .pg').forEach(pg => {
    const i = +pg.dataset.i, img = pg.querySelector('img'), p = CUR.pages[i];
    if (Math.abs(i - IDX) <= 2) {
      const src = pageSrc(p);
      if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
      const hot = pg.querySelector('.hot');
      if (hot.dataset.mode !== MODE) {
        hot.dataset.mode = MODE;
        hot.innerHTML = MODE === 'uk' ? p.blocks.map((b, k) => `<i data-k="${k}" style="left:${b.x0 * 100}%;top:${b.y0 * 100}%;width:${(b.x1 - b.x0) * 100}%;height:${(b.y1 - b.y0) * 100}%"></i>`).join('') : '';
      }
    } else if (Math.abs(i - IDX) > 4 && img.dataset.src) { img.removeAttribute('src'); delete img.dataset.src; }
  });
}
function goto(i, instant) {
  if (!CUR || !CUR.pages.length) return;
  IDX = Math.max(0, Math.min(CUR.pages.length - 1, i));
  const pages = $('#v-pages');
  if (instant) { pages.style.transition = 'none'; requestAnimationFrame(() => pages.style.transition = ''); }
  pages.style.transform = `translateX(${-IDX * 100}%)`;
  $('#v-count').textContent = `${IDX + 1} / ${CUR.pages.length}`;
  $('#v-prev').disabled = IDX === 0; $('#v-next').disabled = IDX === CUR.pages.length - 1;
  hideTip(); loadAround();
}
$('#v-prev').onclick = () => goto(IDX - 1);
$('#v-next').onclick = () => goto(IDX + 1);
$('#v-back').onclick = () => { show('home'); history.replaceState(null, '', location.pathname); $('#v-office').src = 'about:blank'; };
document.querySelectorAll('#v-mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));
function setMode(m) { MODE = m; document.querySelectorAll('#v-mode button').forEach(x => x.classList.toggle('on', x.dataset.m === m)); hideTip(); loadAround(); }
document.addEventListener('keydown', e => {
  if ($('#view').classList.contains('hidden') || /INPUT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goto(IDX + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goto(IDX - 1); }
  else if (e.key.toLowerCase() === 'o' || e.key === 'Tab') { e.preventDefault(); setMode(MODE === 'uk' ? 'sv' : 'uk'); }
  else if (e.key === 'Escape') hideTip();
});
(function swipe() {
  const st = $('#v-stage'); let sx = 0, sy = 0, t0 = 0, multi = false;
  st.addEventListener('touchstart', e => { multi = e.touches.length > 1; sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = Date.now(); }, { passive: true });
  st.addEventListener('touchend', e => {
    if (multi || (window.visualViewport && window.visualViewport.scale > 1.05)) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && Date.now() - t0 < 700) goto(IDX + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();
const tip = $('#tip');
$('#v-pages').addEventListener('click', e => {
  const hit = e.target.closest('.hot i');
  if (!hit) return hideTip();
  const b = CUR.pages[IDX].blocks[+hit.dataset.k]; if (!b) return;
  tip.innerHTML = `<div class="k">${t('original')}</div><div class="sv">${esc(b.sv)}</div><div class="uk">${esc(b.uk)}</div>`;
  tip.classList.remove('hidden');
  const r = hit.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(window.innerWidth - tw - 10, Math.max(10, r.left + r.width / 2 - tw / 2));
  let y = r.bottom + 10; if (y + th > window.innerHeight - 70) y = Math.max(60, r.top - th - 10);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  e.stopPropagation();
});
function hideTip() { tip.classList.add('hidden'); }

$('#v-dl').onclick = async () => {
  if (!CUR) return;
  const btn = $('#v-dl'); btn.disabled = true;
  try {
    if (CUR.kind === 'pptx' || CUR.kind === 'docx') {
      saveAs(CUR.fileBlob || await (await fetch(CUR.fileUrl)).blob(), CUR.fileName || (CUR.title + ' (UA).' + CUR.kind));
    } else {
      const blob = await Engine.pagesToPdf(CUR.pages, async p => p.ukBlob || await (await fetch(p.uk)).blob());
      saveAs(blob, (CUR.title || 'pereklad') + ' (UA).pdf');
    }
  } catch (e) { console.error(e); alert(t('fail')); }
  btn.disabled = false;
};
function saveAs(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

function updateShareBtn() {
  const b = $('#v-share'); if (!CUR) return;
  b.classList.toggle('hidden', !CUR.code && !CUR.saving);
  b.disabled = !CUR.code;
  b.querySelector('span').textContent = CUR.code ? t('share') + ' ' + CUR.code : t('savingShort') + (CUR.saveProgress ? ' ' + Math.round(CUR.saveProgress * 100) + '%' : '');
}
$('#v-share').onclick = () => {
  if (!CUR || !CUR.code) return;
  const link = location.origin + location.pathname + '?d=' + CUR.code;
  $('#s-code').textContent = CUR.code; $('#s-link').textContent = link.replace(/^https?:\/\//, '');
  $('#s-qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=' + encodeURIComponent(link);
  $('#share').classList.remove('hidden');
};
$('#s-close').onclick = () => $('#share').classList.add('hidden');
$('#share').onclick = e => { if (e.target.id === 'share') $('#share').classList.add('hidden'); };
$('#s-copy').onclick = async () => {
  try { await navigator.clipboard.writeText(location.origin + location.pathname + '?d=' + CUR.code); $('#s-copy').textContent = t('copied'); setTimeout(() => $('#s-copy').textContent = t('copy'), 1500); } catch (e) {}
};

applyLang();
(function boot() {
  const d = new URLSearchParams(location.search).get('d');
  if (d) openCode(d.toUpperCase());
  cloudOn();
})();

</script>
